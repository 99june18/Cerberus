source_dir:
  base_gpgpusim: /root/ACCELSIM_ECC_BASELINE/gpgpu-sim/gpgpu-sim_distribution

org_config_dir: /root/ACCELSIM_ECC_BASELINE/gpgpu-sim/gpgpu-sim_distribution/configs/tested-cfgs/SM7_QV100

log_file_path: /root/Cerberus_script/run_status/Cerberus.txt

run: 
  - HBM4_polybench
  - HBM4_parboil
  - HBM4_rodinia
  - HBM4_graphBIG

  - DUO_polybench
  - DUO_parboil
  - DUO_rodinia
  - DUO_graphBIG

  - Unity_polybench
  - Unity_parboil
  - Unity_rodinia
  - Unity_graphBIG

  - Cerberus_polybench
  - Cerberus_parboil
  - Cerberus_rodinia
  - Cerberus_graphBIG
  
  - Cerberus40b_polybench
  - Cerberus40b_parboil
  - Cerberus40b_rodinia
  - Cerberus40b_graphBIG

sets:
  - name: HBM4_rodinia # benchmark / could be not exact name
    dir: /root/samples/gpgpu-sim_simulations/benchmarks/bin/8.0/release/rodinia-3.1 # rodinia folder
    result_dir: /root/Cerberus_script/result/HBM4
    source: base_gpgpusim
    prefix: HBM4_R # logfile prefix
    description: HBM4 # written in log / nessesary
    commonOptions: # optional
      gpgpu_n_mem: "32"
      gpgpu_clock_domains: "1132.0:1132.0:1132.0:1600.0"
      gpgpu_dram_timing_opt: "nbk=32:CCD=2:RRD=4:RCD=30:RAS=55:RP=30:RC=90:CL=24:WL=14:CDLR=6:WR=35:nbkgrp=4:CCDL=4:RTPL=8"
    workloads: 
      - name: b+tree
      - name: backprop
      - name: bfs
      - name: dwt2d
      - name: nw
      - name: srad_v1

  - name: HBM4_parboil
    dir: /root/samples/gpgpu-sim_simulations/benchmarks/bin/8.0/release/parboil
    result_dir: /root/Cerberus_script/result/HBM4
    source: base_gpgpusim
    prefix: HBM4_R
    description: HBM4
    commonOptions:
      gpgpu_n_mem: "32"
      gpgpu_clock_domains: "1132.0:1132.0:1132.0:1600.0"
      gpgpu_dram_timing_opt: "nbk=32:CCD=2:RRD=4:RCD=30:RAS=55:RP=30:RC=90:CL=24:WL=14:CDLR=6:WR=35:nbkgrp=4:CCDL=4:RTPL=8"
    workloads:
      - name: spmv
      - name: mri-q
      - name: sgemm

  - name: HBM4_graphBIG
    dir: /root/samples/gpgpu-sim_simulations/benchmarks/bin/8.0/release/graphBIG/gpu_bench
    result_dir: /root/Cerberus_script/result/HBM4
    source: base_gpgpusim
    prefix: HBM4_G
    description: HBM4
    commonOptions:
      gpgpu_n_mem: "32"
      gpgpu_clock_domains: "1132.0:1132.0:1132.0:1600.0"
      gpgpu_dram_timing_opt: "nbk=32:CCD=2:RRD=4:RCD=30:RAS=55:RP=30:RC=90:CL=24:WL=14:CDLR=6:WR=35:nbkgrp=4:CCDL=4:RTPL=8"
    workloads:
      - name: gpu_BFS
      - name: gpu_DegreeCentr
      - name: gpu_SSSP
      - name: gpu_kCore

  - name: HBM4_polybench
    dir: /root/samples/gpgpu-sim_simulations/benchmarks/bin/8.0/release/polybench-gpu-1.0/CUDA
    result_dir: /root/Cerberus_script/result/HBM4
    source: base_gpgpusim
    prefix: HBM4_B
    description: HBM4
    commonOptions:
      gpgpu_n_mem: "32"
      gpgpu_clock_domains: "1132.0:1132.0:1132.0:1600.0"
      gpgpu_dram_timing_opt: "nbk=32:CCD=2:RRD=4:RCD=30:RAS=55:RP=30:RC=90:CL=24:WL=14:CDLR=6:WR=35:nbkgrp=4:CCDL=4:RTPL=8"
    workloads:
      - name: 3DCONV
      - name: ATAX
      - name: MVT

